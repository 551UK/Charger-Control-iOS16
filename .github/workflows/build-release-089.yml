name: Build and release USB Charge Control v0.8.9

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native iOS 16 UIKit app for arm64
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios16.0 \
            -isysroot "$sdk" \
            -fobjc-arc -O2 -fmodules \
            -framework Foundation -framework UIKit \
            -Wl,-dead_strip \
            source/USBChargeControl.m \
            -o USBChargeControl
          file USBChargeControl
          test -s USBChargeControl
          test "$(file -b USBChargeControl)" != ""
      - uses: actions/upload-artifact@v4
        with:
          name: native-arm64-app-v089
          path: USBChargeControl
          if-no-files-found: error
          retention-days: 7

  package-and-release:
    needs: compile-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: native-arm64-app-v089
          path: ${{ runner.temp }}/compiled
      - name: Build DEB and full source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v089-source" dist
          cd "$RUNNER_TEMP/v089-source"
          unzip -q "$GITHUB_WORKSPACE/dist/551UK-USB-Charge-Control-v0.8.8-Source.zip"
          cp "$GITHUB_WORKSPACE/source/USBChargeControl.m" USBChargeControl.m
          cp "$GITHUB_WORKSPACE/source/Info.plist" Info.plist
          cp "$GITHUB_WORKSPACE/source/control" control
          cp "$GITHUB_WORKSPACE/source/payload/DEBIAN/control" payload/DEBIAN/control
          cp "$GITHUB_WORKSPACE/source/payload/var/jb/Applications/USBChargeControl.app/Info.plist" payload/var/jb/Applications/USBChargeControl.app/Info.plist
          cp "$GITHUB_WORKSPACE/source/README.md" README.md
          cp "$GITHUB_WORKSPACE/source/build_usb_v089.py" build_usb_v089.py
          rm -f build_usb_v088.py
          cp "$RUNNER_TEMP/compiled/USBChargeControl" USBChargeControl
          cp USBChargeControl payload/var/jb/Applications/USBChargeControl.app/USBChargeControl
          chmod 755 USBChargeControl payload/var/jb/Applications/USBChargeControl.app/USBChargeControl
          python3 build_usb_v089.py
          mv 551UK-USB-Charge-Control-v0.8.9.deb "$GITHUB_WORKSPACE/dist/"
          zip -q -r "$GITHUB_WORKSPACE/dist/551UK-USB-Charge-Control-v0.8.9-Source.zip" .
          cd "$GITHUB_WORKSPACE"
          test "$(dpkg-deb -f dist/551UK-USB-Charge-Control-v0.8.9.deb Version)" = '0.8.9'
          test "$(dpkg-deb -f dist/551UK-USB-Charge-Control-v0.8.9.deb Name)" = 'USB Charge Control'
          ! dpkg-deb --contents dist/551UK-USB-Charge-Control-v0.8.9.deb | grep -q 'Applications/ChargingRate.app'
          unzip -t dist/551UK-USB-Charge-Control-v0.8.9-Source.zip | tail -1
      - name: Commit compiled assets to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/551UK-USB-Charge-Control-v0.8.9.deb dist/551UK-USB-Charge-Control-v0.8.9-Source.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Add compiled v0.8.9 DEB and complete source archive'
            git push origin HEAD:main
          fi
      - name: Publish v0.8.9 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=(dist/551UK-USB-Charge-Control-v0.8.9.deb dist/551UK-USB-Charge-Control-v0.8.9-Source.zip)
          if gh release view v0.8.9 >/dev/null 2>&1; then
            gh release upload v0.8.9 "${files[@]}" --clobber
          else
            gh release create v0.8.9 "${files[@]}" --title 'v0.8.9 — UI Layout Improvements' --notes-file RELEASE_NOTES_v0.8.9.md
          fi
