name: Build and release USB Charge Control v0.8.21

on:
  push:
    branches: [main]
    paths:
      - 'source/USBChargeControl.m'
      - 'source/usb_control_panel.py'
      - 'source/551uk-usb-currentd.py'
      - 'tests/test_persistent_cap.py'
      - 'source/payload/DEBIAN/prerm'
      - 'source/payload/DEBIAN/postrm'
      - 'source/payload/var/jb/Library/LaunchDaemons/uk.551.chargerated.plist'
      - 'source/payload/var/jb/Applications/USBChargeControl.app/Info.plist'
      - 'source/payload/DEBIAN/control'
      - 'source/build_usb.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile native iOS 16 UIKit app for arm64
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios16.0 \
            -isysroot "$sdk" \
            -fobjc-arc -O2 -fmodules \
            -framework Foundation -framework UIKit \
            -Wl,-dead_strip \
            source/USBChargeControl.m \
            -o USBChargeControl
          file USBChargeControl
          test -s USBChargeControl
      - uses: actions/upload-artifact@v4
        with:
          name: native-arm64-app-v0821
          path: USBChargeControl
          if-no-files-found: error
          retention-days: 7

  package-and-release:
    needs: compile-app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Test persistent charging cap state machine
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          name: native-arm64-app-v0821
          path: ${{ runner.temp }}/compiled
      - name: Build DEB and complete source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v0821-source" "$GITHUB_WORKSPACE/dist"
          cd "$RUNNER_TEMP/v0821-source"
          unzip -q "$GITHUB_WORKSPACE/dist/551UK-USB-Charge-Control-v0.8.20-Source.zip"
          cp "$GITHUB_WORKSPACE/source/USBChargeControl.m" USBChargeControl.m
          cp "$GITHUB_WORKSPACE/source/usb_control_panel.py" usb_control_panel.py
          cp "$GITHUB_WORKSPACE/source/551uk-usb-currentd.py" 551uk-usb-currentd.py
          mkdir -p payload/var/jb/usr/libexec
          cp "$GITHUB_WORKSPACE/source/usb_control_panel.py" payload/var/jb/usr/libexec/usb_control_panel.py
          cp "$GITHUB_WORKSPACE/source/551uk-usb-currentd.py" payload/var/jb/usr/libexec/551uk-usb-currentd.py
          cp "$GITHUB_WORKSPACE/source/payload/DEBIAN/prerm" payload/DEBIAN/prerm
          cp "$GITHUB_WORKSPACE/source/payload/DEBIAN/postrm" payload/DEBIAN/postrm
          cp "$GITHUB_WORKSPACE/source/payload/var/jb/Library/LaunchDaemons/uk.551.chargerated.plist" payload/var/jb/Library/LaunchDaemons/uk.551.chargerated.plist
          chmod 0755 payload/DEBIAN/prerm payload/DEBIAN/postrm
          cp "$GITHUB_WORKSPACE/source/payload/var/jb/Applications/USBChargeControl.app/Info.plist" Info.plist
          cp "$GITHUB_WORKSPACE/source/payload/DEBIAN/control" control
          cp "$GITHUB_WORKSPACE/source/payload/DEBIAN/control" payload/DEBIAN/control
          cp "$GITHUB_WORKSPACE/source/payload/var/jb/Applications/USBChargeControl.app/Info.plist" payload/var/jb/Applications/USBChargeControl.app/Info.plist
          cp "$GITHUB_WORKSPACE/README.md" README.md
          cp "$GITHUB_WORKSPACE/source/build_usb.py" build_usb.py
          rm -f build_usb_v*.py postinst postrm preinst prerm
          rm -f payload/var/jb/usr/share/doc/uk.551.chargingratetest/README.md
          cp "$RUNNER_TEMP/compiled/USBChargeControl" USBChargeControl
          cp USBChargeControl payload/var/jb/Applications/USBChargeControl.app/USBChargeControl
          chmod 755 USBChargeControl payload/var/jb/Applications/USBChargeControl.app/USBChargeControl
          python3 build_usb.py
          mv 551UK-USB-Charge-Control-v0.8.21.deb "$GITHUB_WORKSPACE/dist/"
          zip -q -r "$GITHUB_WORKSPACE/dist/551UK-USB-Charge-Control-v0.8.21-Source.zip" .
          cd "$GITHUB_WORKSPACE"
          python3 -m py_compile source/usb_control_panel.py source/551uk-usb-currentd.py
          test "$(dpkg-deb -f dist/551UK-USB-Charge-Control-v0.8.21.deb Version)" = '0.8.21'
          test "$(dpkg-deb -f dist/551UK-USB-Charge-Control-v0.8.21.deb Name)" = 'USB Charge Control'
          python3 - <<'PY'
          import plistlib, subprocess, tempfile, pathlib
          deb = 'dist/551UK-USB-Charge-Control-v0.8.21.deb'
          listing = subprocess.check_output(['dpkg-deb','--contents',deb], text=True)
          assert 'Applications/ChargingRate.app' not in listing
          assert 'Applications/USBChargeControl.app' in listing
          with tempfile.TemporaryDirectory() as d:
              subprocess.run(['dpkg-deb','-x',deb,d],check=True)
              p=pathlib.Path(d)/'var/jb/Applications/USBChargeControl.app/Info.plist'
              info=plistlib.loads(p.read_bytes())
              assert info['CFBundleDisplayName']=='Charge Control'
              assert info['CFBundleName']=='Charge Control'
              assert info['CFBundleExecutable']=='USBChargeControl'
              assert info['CFBundleIdentifier']=='uk.551.usbchargecontrol'
              assert info['CFBundleVersion']=='0.8.21'
              import plistlib as pl
              launch=pl.loads((pathlib.Path(d)/'var/jb/Library/LaunchDaemons/uk.551.chargerated.plist').read_bytes())
              assert launch['KeepAlive'] is True
              assert launch['RunAtLoad'] is True
              assert launch['ThrottleInterval'] == 15
              assert launch['StandardErrorPath'].endswith('/daemon-stderr.txt')
              assert launch['StandardOutPath'] == '/dev/null'
              script=pathlib.Path(d)/'var/jb/usr/libexec/usb_control_panel.py'
              daemon=pathlib.Path(d)/'var/jb/usr/libexec/551uk-usb-currentd.py'
              assert script.exists() and daemon.exists()
              assert b'requested-cap.json' in script.read_bytes()
              assert b'RESTORE_UPGRADE' in daemon.read_bytes()
              prerm=pathlib.Path(d)/'DEBIAN/prerm'
              # Package maintainer scripts are inspected separately with dpkg-deb -e.
          PY
          unzip -t dist/551UK-USB-Charge-Control-v0.8.21-Source.zip | tail -1
      - name: Commit compiled files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only keep the newest DEB and full source ZIP in main.
          find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*-Source.zip' \) \
            ! -name '551UK-USB-Charge-Control-v0.8.21.deb' \
            ! -name '551UK-USB-Charge-Control-v0.8.21-Source.zip' -print0 |
            xargs -0 -r git rm -f --
          git add dist/551UK-USB-Charge-Control-v0.8.21.deb dist/551UK-USB-Charge-Control-v0.8.21-Source.zip
          if ! git diff --cached --quiet; then
            git commit -m 'Add compiled v0.8.21 DEB and source archive'
            git push origin HEAD:main
          fi
      - name: Publish v0.8.21 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=(dist/551UK-USB-Charge-Control-v0.8.21.deb dist/551UK-USB-Charge-Control-v0.8.21-Source.zip)
          if gh release view v0.8.21 >/dev/null 2>&1; then
            gh release upload v0.8.21 "${files[@]}" --clobber
          else
            gh release create v0.8.21 "${files[@]}" --title 'v0.8.21' --notes ''
          fi
      - name: Keep only the newest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          keep="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')"
          test "$keep" = "v0.8.21"
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            [ "$tag" = "$keep" ] && continue
            gh release delete "$tag" --yes
          done
